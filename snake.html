<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake · Afridho Tavadhu</title>
<meta name="description" content="Snake, in the style of the portfolio. Arrow keys, WASD or swipe.">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%23141414"/><path d="M18 20 L32 46 L46 20" stroke="%23F2F2F2" stroke-width="7" fill="none" stroke-linejoin="round"/></svg>'>
<script>document.documentElement.classList.add("js")</script>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fira-code-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Same tokens, fonts and grid as index.html (see DESIGN.md); this page is hand-written, not generated. */
@font-face { font-family: "Inter"; font-weight: 400 600; font-display: swap; src: url(fonts/inter-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Fira Code"; font-weight: 400; font-display: swap; src: url(fonts/fira-code-400-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Inter Fallback"; src: local("Arial"); size-adjust: 107.31%; ascent-override: 90.27%;
  descent-override: 22.48%; line-gap-override: 0%; }
:root {
  --bg: #141414; --line: #262626; --text: #F2F2F2; --muted: #8C8C8C; --white: #FFFFFF; --card: #1B1B1B; --pop: #F2C230;
  --pad: 39px; --gut: 30px; color-scheme: dark;
  --sans: "Inter", "Inter Fallback", system-ui, sans-serif; --mono: "Fira Code", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
ol { list-style: none; }
:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
.mono { font-family: var(--mono); }
/* arrows aren't in either font subset; one system face for all of them, so they match */
.sym { font-family: system-ui, sans-serif; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* without JS there's no game: no dead Start button, no d-pad */
html:not(.js) #overlay, html:not(.js) .pad { display: none !important; }

/* 4-column grid with hairline rules at the column boundaries */
.wrap { position: relative; max-width: 1440px; margin: 0 auto; padding-inline: var(--pad); }
.wrap::before { content: ""; position: absolute; inset: 0 var(--pad); pointer-events: none;
  background: linear-gradient(var(--line), var(--line)) 25% 0 / 1px 100% no-repeat,
    linear-gradient(var(--line), var(--line)) 50% 0 / 1px 100% no-repeat,
    linear-gradient(var(--line), var(--line)) 75% 0 / 1px 100% no-repeat; }
.wrap > * { position: relative; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }

.nav { padding-top: 30px; font-size: 14px; align-items: baseline; }
.nav .logo { font-weight: 600; font-size: 16px; letter-spacing: -.02em; }
.nav .back { grid-column: 4; color: var(--muted); } .nav .back:hover { color: var(--text); }

.game { padding: 80px 0 64px; align-items: start; }
/* cols 1-2 let the column rules through, like the hero on index.html; the two-column rows below split on the 25% rule */
.side { grid-column: 1 / 3; }
.label { font: 13px var(--mono); letter-spacing: .04em; color: var(--muted); margin-bottom: 14px; }
h1 { font-weight: 600; font-size: clamp(56px, 8.3vw, 120px); line-height: .97; letter-spacing: -.06em; }
.lead { margin-top: 28px; max-width: 460px; font-size: clamp(18px, 1.7vw, 24px); line-height: 1.33; letter-spacing: -.02em; color: var(--muted); }
.lead span { color: var(--text); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 56px; border-top: 1px solid var(--line); padding-top: 18px; }
.stats div + div, .keys li > :last-child { padding-left: var(--gut); }
.stats dt { font: 13px var(--mono); color: var(--muted); }
.stats dd { font-size: 24px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.keys { margin-top: 40px; border-top: 1px solid var(--line); }
.keys li { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.keys li span:first-child { color: var(--muted); } .keys .mono { font-size: 13px; }

/* the board: a square in cols 3-4, small enough that the whole game fits one screen */
.stage { grid-column: 3 / 5; padding-left: var(--gut); background: var(--bg); scroll-margin-bottom: 16px; }
.board { position: relative; width: min(100%, calc(100svh - 190px)); min-width: min(100%, 320px); aspect-ratio: 1;
  background: var(--card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; container-type: inline-size; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay { position: absolute; inset: 0; display: grid; align-content: safe center; gap: 18px; padding: clamp(20px, 6%, 48px);
  background: rgb(27 27 27 / .92); overflow: auto; }
.overlay[hidden] { display: none; }
.overlay h2 { font-weight: 600; font-size: clamp(32px, 4vw, 48px); line-height: 1; letter-spacing: -.05em; }
.overlay .note { font: 13px var(--mono); color: var(--muted); }
.scores { border-top: 1px solid var(--line); max-width: 420px; }
.scores li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line);
  font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.scores .top { color: var(--text); }
.scores .you { color: var(--text); }
.scores .you span:first-child::after { content: "_"; content: "_" / ""; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.cta { justify-self: start; display: inline-flex; justify-content: space-between; gap: 24px; min-width: 170px; margin-top: 8px;
  padding-bottom: 14px; font-size: 20px; letter-spacing: -.02em;
  background: linear-gradient(var(--white), var(--white)) 0 100% / 100% 2px no-repeat; transition: background-size .3s; }
.cta::after { content: "↵"; content: "↵" / ""; transition: transform .2s; }
.cta:hover { background-size: 0 2px; } .cta:hover::after { transform: translateX(2px); }
/* small boards (320px phones, short desktop windows): the game-over card tightens so Play again stays inside */
@container (max-width: 380px) {
  .overlay { gap: 10px; } .overlay h2 { font-size: 28px; } .scores li { padding: 6px 0; } .cta { margin-top: 2px; padding-bottom: 10px; }
}

/* touch: a d-pad under the board, as well as swipes on it */
.pad { display: none; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 8px; margin-top: 24px; }
.pad button { border: 1px solid var(--line); border-radius: 6px; background: var(--card); font: 18px system-ui, sans-serif; color: var(--muted);
  transition: border-color .2s, color .2s; touch-action: manipulation; }
.pad button:active { border-color: var(--muted); color: var(--text); }
.pad [data-dir="up"] { grid-column: 2; } .pad [data-dir="left"] { grid-column: 1; grid-row: 2; }
.pad [data-dir="down"] { grid-column: 2; grid-row: 2; } .pad [data-dir="right"] { grid-column: 3; grid-row: 2; }
@media (pointer: coarse), (max-width: 1023px) { .pad { display: grid; } }
@media (pointer: coarse) { .keys .desk { display: none; } }
@media (pointer: fine) { .keys .touch { display: none; } }

@media (max-width: 1023px) {
  :root { --pad: 20px; }
  .wrap::before { display: none; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .grid > * { grid-column: 1 / -1 !important; padding: 0 !important; }
  .nav { grid-template-columns: 1fr auto; } .nav .logo { grid-column: 1 !important; }
  .nav .back { grid-column: 2 !important; }
  .nav a { padding: 11px 0 !important; margin: -11px 0; }   /* ~44px hit areas; !important beats the .grid > * reset */
  .stats div + div, .keys li > :last-child { padding-left: 16px; }
  /* compact, so the board and the pad fit one phone screen */
  .game { padding: 28px 0 32px !important; row-gap: 20px; }
  .label { margin-bottom: 6px; } h1 { font-size: 48px; }
  .lead { margin-top: 10px; font-size: 16px; }
  .stats { margin-top: 16px; padding-top: 10px; } .stats dd { font-size: 20px; }
  .pad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); margin-top: 16px; }
  .keys { display: none; }
  .board { width: 100%; min-width: 0; }
  .pad { justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { transition-property: color, background-color, border-color, opacity !important; animation: none !important; }
  .cta:hover::after { transform: none; }
}
</style>
</head>
<body>
<header class="wrap">
  <nav class="grid nav" aria-label="Main">
    <a class="logo" href="index.html">vadhh</a>
    <a class="back" href="index.html"><span aria-hidden="true">←</span> Back to portfolio</a>
  </nav>
</header>

<main class="wrap">
  <div class="grid game">
    <div class="side">
      <p class="label">~/snake --hardcore</p>
      <h1>Snake</h1>
      <p class="lead"><span>Bored? Eat the yellow dots.</span> Don't hit the walls or yourself.</p>
      <dl class="stats">
        <div><dt>Score</dt><dd id="score">0</dd></div>
        <div><dt>Status</dt><dd id="status">Ready</dd></div>
      </dl>
      <p class="sr-only" id="say" aria-live="polite"></p>
      <ul class="keys">
        <li class="desk"><span>Move</span><span class="mono"><span class="sym">↑ ↓ ← →</span> or W A S D</span></li>
        <li class="touch"><span>Move</span><span class="mono">Swipe the board or use the pad</span></li>
        <li class="touch"><span>Pause</span><span class="mono">Tap the board</span></li>
        <li class="desk"><span>Start, pause</span><span class="mono">Space</span></li>
      </ul>
    </div>

    <div class="stage">
      <div class="board">
        <canvas id="board" role="img" aria-label="Snake board"></canvas>
        <div class="overlay" id="overlay">
          <p class="label">Ready</p>
          <h2>Snake</h2>
          <p class="note">20 × 20 board · +10 per dot</p>
          <button class="cta" type="button" data-start>Start game</button>
        </div>
        <noscript><div class="overlay"><h2>Snake</h2><p class="note">The game needs JavaScript.</p></div></noscript>
      </div>
      <div class="pad" role="group" aria-label="Direction pad">
        <button type="button" data-dir="up" aria-label="Up">↑</button>
        <button type="button" data-dir="left" aria-label="Left">←</button>
        <button type="button" data-dir="down" aria-label="Down">↓</button>
        <button type="button" data-dir="right" aria-label="Right">→</button>
      </div>
    </div>
  </div>
</main>

<script>
const N = 20, TICK = 100;   // board size in cells, ms per step
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const KEYS = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };
const cv = document.getElementById("board"), ctx = cv.getContext("2d");
const overlay = document.getElementById("overlay"), scoreEl = document.getElementById("score"), statusEl = document.getElementById("status");
const say = (s) => document.getElementById("say").textContent = s;   // screen readers hear pauses and results, not every step
const css = getComputedStyle(document.documentElement), color = (v) => css.getPropertyValue(v).trim();
const C = { text: color("--text"), white: color("--white"), muted: color("--muted"), pop: color("--pop") };

let snake = [], dir = [1, 0], queue = [], food = [15, 10], score = 0, timer = null, paused = false;

// Turns queue up (two at most) and each is checked against the one before it, so two quick presses inside one
// step can't reverse the snake into itself.
function turn(name) {
  const [x, y] = DIRS[name], [lx, ly] = queue.at(-1) || dir;
  if (!timer || queue.length > 1 || (x === lx && y === ly) || (x === -lx && y === -ly)) return;
  queue.push([x, y]);
}

function placeFood() {
  const free = [];
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if (!snake.some(([sx, sy]) => sx === x && sy === y)) free.push([x, y]);
  food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
}

function start() {
  snake = [[10, 10], [9, 10], [8, 10]]; dir = [1, 0]; queue = []; score = 0; paused = false;
  scoreEl.textContent = 0; statusEl.textContent = "Playing";
  placeFood(); overlay.hidden = true;
  // short phones: bring the board and the pad fully into view
  const stage = cv.closest(".stage");
  if (stage.getBoundingClientRect().bottom > innerHeight) stage.scrollIntoView({ block: "end" });
  clearInterval(timer); timer = setInterval(step, TICK);
  draw();
}

function step() {
  if (queue.length) dir = queue.shift();
  const head = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
  const eats = food && head[0] === food[0] && head[1] === food[1];
  const body = eats ? snake : snake.slice(0, -1);   // the tail moves out of the way unless the snake grows
  if (head[0] < 0 || head[0] >= N || head[1] < 0 || head[1] >= N || body.some(([x, y]) => x === head[0] && y === head[1])) return end();
  snake = [head, ...body];
  if (eats) { score += 10; scoreEl.textContent = score; placeFood(); if (!food) return end(true); }
  draw();
}

function pause() {
  clearInterval(timer); timer = null; paused = true; statusEl.textContent = "Paused";
  overlay.innerHTML = `<p class="label">Paused</p><h2>Snake</h2><p class="note">Score: ${score}</p>
    <button class="cta" type="button" data-resume>Resume</button>`;
  overlay.hidden = false; say(`Paused. Score ${score}.`);
  overlay.querySelector("[data-resume]").focus({ preventScroll: true });
}

function resume() {
  paused = false; overlay.hidden = true; statusEl.textContent = "Playing";
  timer = setInterval(step, TICK);
}

function end(won) {
  clearInterval(timer); timer = null;
  statusEl.textContent = won ? "Cleared" : "Crashed";
  overlay.innerHTML = `
    <p class="label">${won ? "Board cleared" : "Collision detected"}</p>
    <h2>${won ? "You win" : "Game over"}</h2>
    <p class="note">Final score: ${score}</p>
    <ol class="scores" aria-label="Top players">
      <li class="top"><span>1. NANATT</span><span>99999999999999</span></li>
      <li><span>2. VADHH</span><span>050000</span></li>
      <li class="you"><span>3. GUEST (YOU)</span><span>${String(score).padStart(6, "0")}</span></li>
    </ol>
    <button class="cta" type="button" data-start>Play again</button>`;
  overlay.hidden = false; say(`${won ? "You win" : "Game over"}. Final score ${score}.`);
  overlay.querySelector("[data-start]").focus({ preventScroll: true });
}

// Halftone board like the portfolio's background: a dot per cell, the snake in --text fading toward its tail,
// the head in --white, the food in --pop (the background's glint colour).
function draw() {
  const s = cv.width / N;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = C.muted; ctx.globalAlpha = .28; ctx.beginPath();
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) { const cx = (x + .5) * s, cy = (y + .5) * s; ctx.moveTo(cx + s * .06, cy); ctx.arc(cx, cy, s * .06, 0, 7); }
  ctx.fill();
  if (food) { ctx.globalAlpha = 1; ctx.fillStyle = C.pop; ctx.beginPath(); ctx.arc((food[0] + .5) * s, (food[1] + .5) * s, s * .3, 0, 7); ctx.fill(); }
  snake.forEach(([x, y], i) => {
    ctx.globalAlpha = i ? 1 - .6 * i / snake.length : 1;
    ctx.fillStyle = i ? C.text : C.white;
    ctx.beginPath(); ctx.roundRect(x * s + s * .08, y * s + s * .08, s * .84, s * .84, s * .2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// crisp at any size and pixel ratio: the bitmap follows the canvas's CSS size, and the pixel ratio when the window
// moves to a screen with a different one (the CSS size doesn't change then, so the observer alone misses it)
const fit = () => {
  const px = Math.round(cv.clientWidth * Math.min(devicePixelRatio || 1, 2));
  if (px && cv.width !== px) { cv.width = cv.height = px; draw(); }
};
new ResizeObserver(fit).observe(cv);
const watchRatio = () => matchMedia(`(resolution: ${devicePixelRatio}dppx)`).addEventListener("change", () => { fit(); watchRatio(); }, { once: true });
watchRatio();

document.addEventListener("click", (e) => {
  if (e.target.closest("[data-start]")) start();
  if (e.target.closest("[data-resume]")) resume();
  const d = e.target.closest("[data-dir]"); if (d) turn(d.dataset.dir);
});
document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey || e.altKey) return;   // browser shortcuts stay the browser's
  // a held Space would pause, then its repeats land on the focused Resume button and click it on release
  if (e.repeat && (k === " " || k === "enter")) return e.preventDefault();
  if (timer && KEYS[k]) { e.preventDefault(); turn(KEYS[k]); }   // no page scroll mid-game
  else if (timer && k === " ") { e.preventDefault(); pause(); }
  // Space/Enter on a focused button is the button's own click; elsewhere they start or resume
  else if (!timer && (k === " " || k === "enter") && !e.target.closest("button, a")) { e.preventDefault(); paused ? resume() : start(); }
});
// swipes on the board turn; a tap on it pauses (touch has no Space key)
let touch = null;
cv.addEventListener("pointerdown", (e) => { touch = [e.clientX, e.clientY]; });
cv.addEventListener("pointercancel", () => { touch = null; });
cv.addEventListener("pointerup", (e) => {
  if (!touch) return;
  const dx = e.clientX - touch[0], dy = e.clientY - touch[1]; touch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return timer && pause();
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
});
// a hidden tab would let the snake run blind into a wall, so it pauses
document.addEventListener("visibilitychange", () => document.hidden && timer && pause());
</script>
</body>
</html>
